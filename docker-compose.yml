services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-}
      MODEL_DIR: ${MODEL_DIR:-/workspace/artifacts/ptbxl-resnet1d-v1}
      MODEL_DEVICE: cpu
      DB_PATH: /data/cardioscan.db
    volumes:
      - db_data:/data
      - ./artifacts:/workspace/artifacts:ro
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  db_data:
